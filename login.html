<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NILE | Sign In</title>

<link rel="stylesheet" href="login.css">

</head>

<body>

<div class="login-box">

<h1>NILE</h1>

<h2>Sign In</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Sign In

</button>

</form>

</div>
<div id="toast"></div>

<script src="toast.js"></script>

<script src="login.js"></script>

</body>

</html>
