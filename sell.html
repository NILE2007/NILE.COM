<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sell on NILE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="sell.css">

</head>

<body>

<header>

<div class="container navbar">

<a href="index.html" class="logo">NILE</a>

<nav>

<ul>

<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="sell.html" class="active">Sell</a></li>
<li><a href="cart.html">Cart</a></li>

</ul>

</nav>

</div>

</header>

<section class="sell-hero">

<div class="container">

<h1>Grow Your Business With NILE</h1>

<p>

Join thousands of African entrepreneurs selling authentic products across the continent.

</p>

<a href="#register" class="start-btn">

Start Selling

</a>

</div>

</section>

<section id="register" class="seller-form">

<div class="container">

<h2>Become a Seller</h2>

<form id="sellerForm">

<input type="text" id="business" placeholder="Business Name" required>

<input type="text" id="owner" placeholder="Owner Name" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<input type="text" id="country" placeholder="Country" required>

<input type="text" id="city" placeholder="City" required>

<input type="password"
id="password"
placeholder="Create Password"
required>

<input type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<textarea
id="about"
placeholder="Tell us about your business"
rows="6"></textarea>

<button type="submit">

Submit Application

</button>

</form>

<script src="sell.js"></script>

</body>

</html>
